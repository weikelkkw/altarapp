name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref so the latest commit "wins."
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default to least privilege; jobs can widen with their own permissions block.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders so Next can statically analyze without real keys.
      # Vercel injects the real values at deploy time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: https://thealtar.app
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.placeholder
      BIBLE_API_KEY: placeholder
      ANTHROPIC_API_KEY: sk-ant-placeholder
      ELEVENLABS_API_KEY: placeholder
    steps:
      # Third-party actions pinned to commit SHA to defeat tag-rewrite supply
      # chain attacks. Update via Dependabot's github-actions ecosystem.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `--ignore-scripts` blocks postinstall scripts from arbitrary deps —
      # supply-chain defense. None of our direct deps need a postinstall.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # SBOM (CycloneDX-shaped) — generated per build, kept as a CI artifact
      # so any production deploy can be traced to its exact dependency set.
      - name: Generate SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: npm audit (high+ blocks merge)
        run: npm audit --audit-level=high
